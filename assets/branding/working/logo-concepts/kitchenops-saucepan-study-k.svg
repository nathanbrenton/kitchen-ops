<svg
  xmlns="http://www.w3.org/2000/svg"
  version="1.1"
  width="512"
  height="512"
  viewBox="0 0 512 512"
>
  <!--
    HANDLE

    Construction principle:
    - both outer edges follow the same diagonal axis;
    - the grip is wider than the neck;
    - both neck points extend INTO the saucepan rim;
    - the inner hole follows the same axis and taper.

    Explicit flat fill and closed paths are intentionally used
    for broad vector / embroidery-import compatibility.
  -->
  <path
    fill="#000000"
    fill-rule="evenodd"
    d="
      M 177 284
      L 52 392
      Q 28 413 50 437
      Q 72 459 95 438
      L 203 310
      Z

      M 145 331
      L 81 389
      Q 72 398 81 407
      Q 90 416 99 407
      L 157 343
      Q 163 337 157 331
      Q 151 325 145 331
      Z
    "
  />

  <!--
    SAUCEPAN BODY

    The handle is drawn first.

    The saucepan is drawn second so its black rim covers the
    overlapping neck geometry and creates one continuous silhouette.
  -->
  <path
    fill="#000000"
    fill-rule="evenodd"
    d="
      M 400 230
      C 400 177.533 341.797 135 270 135
      C 198.203 135 140 177.533 140 230
      C 140 282.467 198.203 325 270 325
      C 341.797 325 400 282.467 400 230
      Z

      M 364 220
      C 364 185.758 321.918 158 270 158
      C 218.082 158 176 185.758 176 220
      C 176 254.242 218.082 282 270 282
      C 321.918 282 364 254.242 364 220
      Z
    "
  />
</svg>
